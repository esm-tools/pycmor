          cache-from: type=gha,scope=py3.12
          cache-to: type=gha,mode=max,scope=py3.12
  # Meta test jobs - one per Python version
  test-meta-3-9:
    name: Meta Test Python 3.9
    needs: [build-3-9]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: micromamba run -n base /bin/bash -e {0}
    env:
      GITHUB_ACTIONS: true
      HDF5_DEBUG: 1
      NETCDF_DEBUG: 1
      PYCMOR_USE_REAL_TEST_DATA: 1
      PYCMOR_XARRAY_OPEN_MFDATASET_ENGINE: netcdf4
      PYCMOR_XARRAY_OPEN_MFDATASET_PARALLEL: no
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: 300
    container:
      image: ghcr.io/esm-tools/pycmor-testground:py3.9-${{ needs.build-3-9.outputs.branch_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pycmor from source
        run: pip install --no-deps -e .
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/pycmor/test_data
          key: pycmor-test-data-v3
          restore-keys: |
            pycmor-test-data-
      - name: Create persistent cache directory
        run: mkdir -p ~/.cache/pycmor/test_data
      - name: Test if data will work (Meta-Test) and generate coverage
        run: |
          pytest -vvv -s --cov=src/pycmor tests/meta/**.py
          echo '=== Cache after meta tests ==='
          tree -h ~/.cache/pycmor/test_data/
          python -m coverage xml -o coverage-meta-3.9.xml
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-meta-3.9
          path: coverage-meta-3.9.xml
