  # Discovery job to dynamically get list of registered models and orchestrators
  discover-models:
    name: Discover Model Fixtures and Orchestrators
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.discover.outputs.models }}
      orchestrators: ${{ steps.discover.outputs.orchestrators }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package to register entry points
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install --no-deps "pycmor-test-data-fesom @ git+https://github.com/fesom/pycmor_test_data.git@main"
      - name: Discover models and orchestrators
        id: discover
        run: |
          python .github/scripts/discover_models.py --output models > models.json
          echo "models=$(cat models.json)" >> $GITHUB_OUTPUT

          python .github/scripts/discover_models.py --output orchestrators > orchestrators.json
          echo "orchestrators=$(cat orchestrators.json)" >> $GITHUB_OUTPUT

          echo "Models:"
          cat models.json
          echo ""
          echo "Orchestrators:"
          cat orchestrators.json

  # Integration test matrix - Python 3.9
  test-integration-matrix-3-9:
    name: Integration 3.9 / ${{ matrix.model }} / ${{ matrix.cmip-version }} / ${{ matrix.orchestrator-config.id }}
    needs: [build-3-9, discover-models, test-meta-3-9]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: micromamba run -n base /bin/bash -e {0}
    env:
      GITHUB_ACTIONS: true
      PYCMOR_USE_REAL_TEST_DATA: 1
      PYCMOR_FORCE_REEXTRACT: 1
      PYCMOR_XARRAY_OPEN_MFDATASET_ENGINE: netcdf4
      PYCMOR_XARRAY_OPEN_MFDATASET_PARALLEL: no
      PYCMOR_PIPELINE_WORKFLOW_ORCHESTRATOR: ${{ matrix.orchestrator-config.pipeline_workflow_orchestrator }}
      PYCMOR_ENABLE_DASK: ${{ matrix.orchestrator-config.enable_dask }}
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: 300
    container:
      image: ghcr.io/esm-tools/pycmor-testground:py3.9-${{ needs.build-3-9.outputs.branch_name }}
