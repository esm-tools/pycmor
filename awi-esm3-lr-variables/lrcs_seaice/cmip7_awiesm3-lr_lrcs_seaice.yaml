tier: lrcs_seaice
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: siconca
  compound_name: seaIce.siconca.tavg-u-hxy-u.mon.glb
  model_variable: ci
  expected_units: '1'
  lr_scale: 100
  lr_units: '%'
  pipelines:
  - lr_monthly
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_ci_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
not_enabled:
- name: sidconcdyn
