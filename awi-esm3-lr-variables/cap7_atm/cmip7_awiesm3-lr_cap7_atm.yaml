tier: cap7_atm
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: ci_mon
  compound_name: atmos.ci.tavg-u-hxy-u.mon.glb
  model_variable: ci
  expected_units: '1'
  lr_scale: 1
  lr_units: '1'
  pipelines:
  - lr_monthly
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_ci_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
- name: rtmt_mon
  compound_name: atmos.rtmt.tavg-u-hxy-u.mon.glb
  model_variable: tsr
  expected_units: J m-2
  lr_scale: 1
  lr_units: W m-2
  pipelines:
  - lr_linear
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_terms:
  - variable: tsr
    units: J m-2
    coefficient: 0.0002777777777777778
    pattern: atm_remapped_1m_tsr_1m_\d{4}\-\d{4}\.nc$
  - variable: ttr
    units: J m-2
    coefficient: 0.0002777777777777778
    pattern: atm_remapped_1m_ttr_1m_\d{4}\-\d{4}\.nc$
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_tsr_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
not_enabled:
- name: hfls_day
  compound_name: atmos.hfls.tavg-u-hxy-u.day.glb
