tier: extra_land
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: lai_mon
  compound_name: land.lai.tavg-u-hxy-lnd.mon.glb
  model_variable: lai
  source_units: m2 m-2
  pipelines:
  - lr_lpj
  time_dimname: time
  grid_label: gn
  grid: LPJ-GUESS native TCO95 land cells
  lr_input:
    component: lpj_guess
    pattern: lai_monthly.out
  lr_grid_key: lpj
  lr_group: land
