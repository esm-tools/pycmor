# CMIP7 CAP7 Aerosol / AtmosChem Variables — AWI-ESM3-veg-LR
# Generated from 5 CSVs in cap7_aerosol/
#
# AWI-ESM3-veg-LR has NO prognostic aerosol (uses MACv2-SP) and NO interactive
# chemistry. Producible variables:
# - toz: total column ozone from prescribed climatology
# - cfc11, cfc12: prescribed WMGHG scalars from input4MIPs forcing files
# See cmip7_cap7_aerosol_todo.md for full variable tracking.

general:
  name: "awiesm3-cmip7-cap7-aerosol"
  cmor_version: "CMIP7"
  mip: "CMIP"
  CMIP7_DReq_metadata: "/home/a/a270092/.cache/pycmor/cmip7_metadata/v1.2.2.4/metadata.json"

pycmor:
  enable_output_subdirs: true
  warn_on_no_rule: False
  parallel: False
  dask_cluster: "slurm"
  dask_n_workers: 1
  dask_cluster_scaling_mode: "fixed"
  dask_cluster_scaling_fixed_jobs: 1

jobqueue:
  slurm:
    name: pycmor-worker
    queue: compute
    account: bb1469
    cores: 16
    memory: 256GB
    walltime: '00:30:00'

pipelines:
  # GHG scalar pipeline: the 12 monthly values OpenIFS used in the model
  # year, from the centennial input4MIPs forcing record: forcing_year's
  # values (1850; piControl, 1pctCO2, abrupt-4xCO2), or with forcing_year
  # null the model year's own, interpolated monthly (historical).
  # `year` (model year) is injected per-run by examples/repoint_hr_year.py;
  # `forcing_year` is set in the inherit block and by the historical profile.
  # Without this, the rule would emit one output file per year of the input
  # record (273 files for a 1750-2022 forcing file).
  - name: ghg_scalar_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:broadcast_forcing_year_to_monthly
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # co2mass: the CO2 OpenIFS prescribed (per experiment and year, see
  # co2mass_from_prescribed_co2) times the month's atmospheric mass from
  # the model's own surface pressure.
  - name: co2mass_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:co2mass_from_prescribed_co2
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # Scale pipeline for toz: tco3 (kg m-2) -> toz (m)
  # toz(m) = tco3(kg/m2) / rho_O3_STP = tco3 / 2.1415
  - name: toz_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # CH4/N2O from the OpenIFS radiation climatology (oifs_ghg_climatology_field).
  # Model levels: from the month-mean 6-hourly ps on the native grid, with
  # the hybrid coordinate added like every alevel product.
  - name: ghg_alevel_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:oifs_ghg_climatology_field
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - script://$PYCMOR_HOME/examples/custom_steps.py:add_hybrid_sigma_coordinate
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # p19: ps (atm_remapped_1m_sp) supplies the regular grid and months.
  - name: ghg_plev_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:oifs_ghg_climatology_field
      - pycmor.std_lib.add_vertical_bounds
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # p19 tclm: the twelve months of the window (accumulate_monthly_climatology
  # sets the climatology years the save writes as climatology bounds).
  - name: ghg_plev_climatology_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:accumulate_monthly_climatology
      - script://$PYCMOR_HOME/examples/custom_steps.py:oifs_ghg_climatology_field
      - pycmor.std_lib.add_vertical_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # Global-mean tclm: the 12 monthly 1850 values of ghg_scalar_pipeline,
  # labelled as the climatology of the window.
  - name: ghg_scalar_climatology_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:broadcast_forcing_year_to_monthly
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - script://$PYCMOR_HOME/examples/custom_steps.py:as_monthly_climatology
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # Ozone: mass mixing ratio to mole fraction, on model levels, on pressure
  # levels, and from the lowest model level.
  - name: o3_alevel_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.add_vertical_bounds
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - script://$PYCMOR_HOME/examples/custom_steps.py:add_hybrid_sigma_coordinate
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  - name: o3_plev_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.add_vertical_bounds
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  - name: o3_surface_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - pycmor.std_lib.generic.get_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:select_lowest_model_level
      - script://$PYCMOR_HOME/examples/custom_steps.py:scale_by_constant
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:apply_variable_attributes
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

  # Aerosol optical depth: sum of the rule's summed_variables (one input file
  # each) with the 550 nm comment the request asks for.
  - name: aod_pipeline
    steps:
      - pycmor.core.gather_inputs.load_mfdataset
      - script://$PYCMOR_HOME/examples/custom_steps.py:sum_variables
      - pycmor.std_lib.timeaverage.timeavg
      - pycmor.std_lib.set_time_bounds
      - pycmor.std_lib.units.handle_unit_conversion
      - pycmor.std_lib.attributes.set_global
      - pycmor.std_lib.attributes.set_variable
      - script://$PYCMOR_HOME/examples/custom_steps.py:apply_variable_attributes
      - pycmor.std_lib.attributes.set_coordinates
      - pycmor.std_lib.dimensions.map_dimensions
      - pycmor.core.caching.manual_checkpoint
      - pycmor.std_lib.generic.trigger_compute
      - pycmor.std_lib.generic.show_data
      - pycmor.std_lib.files.save_dataset
      - pycmor.std_lib.qc.run_compliance_checker

inherit:
  # Write-perf defaults rolled out from HR atm core bench:
  netcdf_write_scheduler: synchronous
  data_path: &dp /work/ab1095/a270073/out/awiesm3-v3.5.0-cc/pi/outdata/oifs
  ghg_path: &ghg /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg
  # The model's NCMIPFIXYR: read 1850 GHG values from the centennial
  # input4MIPs forcing file regardless of the model run year. The cmor output
  # time axis is rewritten to the model `year` (injected per-run by repoint).
  # The historical profile in repoint_hr_year.py sets it to null, so the
  # gases follow the model year, as in that run.
  forcing_year: 1850
  # How the model changed CO2 on top of that (co2mass_mon): file means not
  # at all (piControl, historical). The 1pctCO2 and abrupt-4xCO2 profiles
  # replace it with 1pct or abrupt4x.
  co2_scenario: file
  # EMD placeholder: no LR source_id is registered yet. The value is set
  # once, in MODELS['lr'] in examples/repoint_hr_year.py.
  source_id: __LR_SOURCE_ID__
  institution_id: AWI
  institution: "Alfred Wegener Institute for Polar and Marine Research"
  contact: cmip7@awi.de
  experiment_id: piControl
  variant_label: r1i1p1f1
  # Parent/branch metadata: piControl branches from piControl-spinup
  # (CMIP7 experiment CV). The spinup ran 330 years on its own calendar
  # starting 1350-01-01, so the branch at its end is 1680-01-01.
  # TODO(LR): these are the HR spinup's values, copied unchanged. Replace
  # them with the LR piControl-spinup branch point once that run is fixed.
  parent_time_units: "days since 1350-01-01"
  branch_time_in_parent: 120522.0
  # grid_label follows the actual grid of each rule's source, not the tier.
  # The labels are EMD placeholders, defined once in MODELS['lr'] in
  # examples/repoint_hr_year.py and substituted when the yamls are repointed:
  # __LR_GRID_ATM__ OIFS TCo95 reduced Gaussian (40320 cells, incl. its land
  # and 30S-90S subsets), __LR_GRID_ATM_REGULAR__ the 192x400 regular regrid,
  # __LR_GRID_OCEAN__ FESOM CORE3 nodes (220509), __LR_GRID_OCEAN_ELEM__ FESOM
  # CORE3 elements (426403). Rules whose source differs from this default
  # carry their own grid_label.
  grid_label: __LR_GRID_ATM_REGULAR__
  grid: "OpenIFS TCo95 regridded to a regular 0.9 x 0.9375 degree latitude-longitude grid (192 x 400)"
  nominal_resolution: "100 km"
  time_dimname: time_counter
  output_directory: ./cmorized_output/awiesm3
  # QC: in-pipeline CF + WCRP-CMIP7 compliance check on every saved file.
  qc_enabled: true
  qc_repack: true
  qc_tests: ["cf", "wcrp_cmip7", "aicc"]
  qc_checker_options: ["aicc:grid_config:/work/ab0246/a270092/software/pycmor/awi-esm3-veg-hr-variables/aicc_grid_config.json"]
  qc_ignore_codes: ["VAR004"]

  activity_id: CMIP
  parent_experiment_id: no parent
  calendar: proleptic_gregorian
rules:
  # od550aer: CAMS-climatology AOD plus the MACv2-SP plumes, see the aerosol
  # optical depth rules at the end (MACv2-SP alone is not total AOD).

  # cfc11: global-mean mole fraction from input4MIPs annual GHG forcing file.
  # CMIP7 registry says units='1E-12' (file values are in ppt, label is the
  # scaling factor); annual -> monthly by ffill in the pipeline.
  - name: cfc11_mon
    inputs:
      - path: *ghg
        pattern: cfc11_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.cfc11.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: cfc11
    scale_factor: 1.0
    scaled_units: "1E-12"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # cfc12: same shape as cfc11 (ppt -> file labelled 1E-12).
  - name: cfc12_mon
    inputs:
      - path: *ghg
        pattern: cfc12_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.cfc12.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: cfc12
    scale_factor: 1.0
    scaled_units: "1E-12"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # ch4: global-mean mole fraction from input4MIPs annual GHG forcing file.
  # CMIP7 registry says units='1E-09' (file values are in ppb).
  # The value is the prescribed global mean. Radiation distributes it with
  # the OpenIFS gas climatology (NGHGRAD=16), so CH4 is not spatially
  # uniform; the 3D products follow at the end of the rules.
  - name: ch4_mon
    inputs:
      - path: *ghg
        pattern: ch4_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.ch4.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: ch4
    scale_factor: 1.0
    scaled_units: "1E-09"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # n2o: same shape as ch4 (ppb -> file labelled 1E-09).
  - name: n2o_mon
    inputs:
      - path: *ghg
        pattern: n2o_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022\.nc
    compound_name: atmosChem.n2o.tavg-u-hm-air.mon.glb
    grid_label: g010  # globales Mittel; CV-TT 2026-09-02: g010 ist das globale Spezialgitter, g190 ein Box-Modell-Gitter
    model_variable: n2o
    scale_factor: 1.0
    scaled_units: "1E-09"
    skip_input_year_filter: true
    pipelines:
      - ghg_scalar_pipeline

  # co2mass: total atmospheric CO2 mass. No CO2 tracer, but the CO2 OpenIFS
  # prescribed is known exactly: the input4MIPs value of forcing_year, grown
  # 1%/yr (1pctCO2), times 4 (abrupt-4xCO2), or the file's own year
  # (historical), interpolated monthly as ece_cmip_ghg.F90 does. Input is
  # the model's monthly surface pressure, for the atmosphere's mass.
  - name: co2mass_mon
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmos.co2mass.tavg-u-hm-u.mon.glb
    grid_label: g010  # globale Summe, wie die GHG-Skalare oben
    model_variable: sp
    co2_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/co2_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc
    pipelines:
      - co2mass_pipeline

  # toz: total column ozone from IFS prescribed ozone
  # tco3 (kg m-2) -> toz (m) via division by O3 density at STP (2.1415 kg/m3)
  - name: toz_mon
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_tco3_.*\.nc
    compound_name: aerosol.toz.tavg-u-hxy-u.mon.glb
    model_variable: tco3
    scale_factor: 0.46697
    scaled_units: "m"
    pipelines:
      - toz_pipeline

  # ============================================================
  # CH4 and N2O as the radiation used them (design 4.6)
  # ============================================================
  # With NGHGRAD=16 (OpenIFS log) radiation does not use one global value
  # for CH4 and N2O: it takes the latitude x pressure x month climatology
  # greenhouse_gas_climatology_48r1.nc and scales it to the year's global
  # mean (upd_ghgclim.F90), here the 1850 input4MIPs means the ch4_mon and
  # n2o_mon rules above report. oifs_ghg_climatology_field repeats the
  # model's time, latitude and layer interpolation. The climatology file is
  # the copy the run staged in its work/ifsdata (the planner points the
  # template path there). The fields do not change from year to year in
  # piControl, so the processing notes ask for tclm-p19 and tclm-u-hm; the
  # yearly tavg-al and tavg-p19 products are written as well.

  - name: ch4_mon_ml
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    ps_path: *dp
    ps_pattern: atmos_6h_pt_sp_.*\.nc
    ps_variable: sp
    pipelines:
      - ghg_alevel_pipeline
    inputs:
      - path: *dp
        pattern: atmos_6h_pt_sp_.*\.nc
    compound_name: atmosChem.ch4.tavg-al-hxy-u.mon.glb
    model_variable: sp
    ghg_gas: ch4
    ghg_vertical: model_levels
    ghg_climatology_file: /work/ab0246/a270092/input/oifs-48r1/ifsdata/greenhouse_gas_climatology_48r1.nc
    ghg_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/ch4_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc
    lazy_write: true

  - name: ch4_mon_pl
    pipelines:
      - ghg_plev_pipeline
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmosChem.ch4.tavg-p19-hxy-air.mon.glb
    model_variable: sp
    ghg_gas: ch4
    ghg_vertical: pressure_levels
    plevels: [100000., 92500., 85000., 70000., 60000., 50000., 40000., 30000., 25000., 20000., 15000., 10000.,
              7000., 5000., 3000., 2000., 1000., 500., 100.]
    ghg_climatology_file: /work/ab0246/a270092/input/oifs-48r1/ifsdata/greenhouse_gas_climatology_48r1.nc
    ghg_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/ch4_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc

  - name: ch4_clim_pl
    pipelines:
      - ghg_plev_climatology_pipeline
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmosChem.ch4.tclm-p19-hxy-air.mon.glb
    model_variable: sp
    ghg_gas: ch4
    ghg_vertical: pressure_levels
    plevels: [100000., 92500., 85000., 70000., 60000., 50000., 40000., 30000., 25000., 20000., 15000., 10000.,
              7000., 5000., 3000., 2000., 1000., 500., 100.]
    ghg_climatology_file: /work/ab0246/a270092/input/oifs-48r1/ifsdata/greenhouse_gas_climatology_48r1.nc
    ghg_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/ch4_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc

