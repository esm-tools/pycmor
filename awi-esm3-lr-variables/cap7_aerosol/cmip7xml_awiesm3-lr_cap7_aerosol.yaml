    compound_name: aerosol.o3.tmax-h2m-hxy-u.day.glb
    model_variable: o3
    scale_factor: 0.6034476  # kg kg-1 -> mol mol-1: M(air)/M(O3) = 28.9644/47.9982
    scaled_units: "mol mol-1"
    variable_attributes:
      comment: "Lowest model level (about 10 m above the surface), not interpolated to 2 m."
    lazy_write: true

  # ============================================================
  # Aerosol optical depth at 550 nm (esm_tools change O6)
  # ============================================================
  # radaca.F90 computes the CAMS-climatology optical depths (aod550 total,
  # aod550bc/du/om/su/ss per species), written to monthly files
  # atmos_mon_aod_<field> on the reduced grid. od550aer adds the MACv2-SP
  # anthropogenic plumes (macv2sp_taod550), which radiation applies on top.
  # The archived macv2sp_taod550 is on the regular grid only
  # (atm_remapped_1m), so the same file must also write it on the reduced
  # grid. Before the spinup takes these rules, the test month has to show
  # that aod550 does not already contain the MACv2-SP part, otherwise
  # od550aer counts it twice. The species products are the CAMS climatology
  # alone; the plumes are not apportioned to species.

  - name: od550aer_mon
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    pipelines:
      - aod_pipeline
    inputs:
      - path: *dp
        pattern: atmos_mon_aod_aod550_.*\.nc
      - path: *dp
        pattern: atmos_mon_aod_macv2sp_taod550_.*\.nc
    compound_name: aerosol.od550aer.tavg-u-hxy-u.mon.glb
    model_variable: od550aer
    summed_variables: [aod550, macv2sp_taod550]
    variable_attributes:
      comment: "wavelength: 550 nm. CAMS climatology aerosol (radaca.F90) plus the MACv2-SP anthropogenic plumes; no stratospheric aerosol."

  - name: od550bc_mon
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    pipelines:
      - aod_pipeline
    inputs:
