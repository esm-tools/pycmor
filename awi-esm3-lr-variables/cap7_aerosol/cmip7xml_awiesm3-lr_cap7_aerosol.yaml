        pattern: atmos_mon_aod_aod550su_.*\.nc
    compound_name: aerosol.od550so4.tavg-u-hxy-u.mon.glb
    model_variable: od550so4
    summed_variables: [aod550su]
    variable_attributes:
      comment: "wavelength: 550 nm. CAMS climatology aerosol component (radaca.F90), without the MACv2-SP plumes."

  - name: od550ss_mon
