    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmosChem.n2o.tavg-p19-hxy-air.mon.glb
    model_variable: sp
    ghg_gas: n2o
    ghg_vertical: pressure_levels
    plevels: [100000., 92500., 85000., 70000., 60000., 50000., 40000., 30000., 25000., 20000., 15000., 10000.,
              7000., 5000., 3000., 2000., 1000., 500., 100.]
    ghg_climatology_file: /work/ab0246/a270092/input/oifs-48r1/ifsdata/greenhouse_gas_climatology_48r1.nc
    ghg_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/n2o_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc

  - name: n2o_clim_pl
    pipelines:
      - ghg_plev_climatology_pipeline
    inputs:
      - path: *dp
        pattern: atm_remapped_1m_sp_.*\.nc
    compound_name: atmosChem.n2o.tclm-p19-hxy-air.mon.glb
    model_variable: sp
    ghg_gas: n2o
    ghg_vertical: pressure_levels
    plevels: [100000., 92500., 85000., 70000., 60000., 50000., 40000., 30000., 25000., 20000., 15000., 10000.,
              7000., 5000., 3000., 2000., 1000., 500., 100.]
    ghg_climatology_file: /work/ab0246/a270092/input/oifs-48r1/ifsdata/greenhouse_gas_climatology_48r1.nc
    ghg_forcing_file: /work/ab0246/a270092/input/oifs-48r1/cmip7-data/ghg/n2o_input4MIPs_GHGConcentrations_CMIP_CR-CMIP-1-0-0_gm_1750-2022.nc

