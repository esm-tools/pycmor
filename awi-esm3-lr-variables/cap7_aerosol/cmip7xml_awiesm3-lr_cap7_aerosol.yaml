    scale_factor: 1.0e-9
    scaled_units: "mol mol-1"
    skip_input_year_filter: true
    climatology_static_inputs: true
    pipelines:
      - ghg_scalar_climatology_pipeline

  # ============================================================
  # Ozone (esm_tools change O4)
  # ============================================================
  # OpenIFS carries prognostic ozone (YO3_NL%LGP) and radiation uses it
  # (LEPO3RA). o3 is a mass mixing ratio, so the rules convert to mole
  # fraction. Ozone varies from year to year, so the processing note of
  # atmosChem.o3.tclm-p19 asks for tavg-p19 instead; the planner reports the
  # tclm product as not applicable (data_request_coverage).
  - name: o3_mon_ml
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    ps_path: *dp
    ps_pattern: atmos_6h_pt_sp_.*\.nc
    ps_variable: sp
    pipelines:
      - o3_alevel_pipeline
    inputs:
      - path: *dp
        pattern: atmos_mon_ml_o3_.*\.nc
    compound_name: atmosChem.o3.tavg-al-hxy-u.mon.glb
    model_variable: o3
    scale_factor: 0.6034476  # kg kg-1 -> mol mol-1: M(air)/M(O3) = 28.9644/47.9982
    scaled_units: "mol mol-1"
    lazy_write: true

  - name: o3_mon_pl
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    pipelines:
      - o3_plev_pipeline
    inputs:
      - path: *dp
        pattern: atmos_mon_pl_o3_.*\.nc
    compound_name: atmosChem.o3.tavg-p19-hxy-air.mon.glb
    model_variable: o3
    scale_factor: 0.6034476  # kg kg-1 -> mol mol-1: M(air)/M(O3) = 28.9644/47.9982
    scaled_units: "mol mol-1"

  # Near-surface ozone from the lowest model level (about 10 m above the
  # surface), hourly mean in atmos_1h_o3low; the processing note accepts a
  # best estimate instead of 2 m.

  - name: o3_surface_1hr
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
    pipelines:
      - o3_surface_pipeline
    inputs:
      - path: *dp
        pattern: atmos_1h_o3low_o3_.*\.nc
    compound_name: aerosol.o3.tavg-h2m-hxy-u.1hr.glb
    model_variable: o3
    scale_factor: 0.6034476  # kg kg-1 -> mol mol-1: M(air)/M(O3) = 28.9644/47.9982
    scaled_units: "mol mol-1"
    variable_attributes:
      comment: "Lowest model level (about 10 m above the surface), not interpolated to 2 m."
    lazy_write: true

  - name: o3_surface_day_max
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
