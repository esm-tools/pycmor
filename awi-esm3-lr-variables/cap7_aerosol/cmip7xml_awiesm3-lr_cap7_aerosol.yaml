        pattern: atmos_mon_aod_aod550bc_.*\.nc
    compound_name: aerosol.od550bc.tavg-u-hxy-u.mon.glb
    model_variable: od550bc
    summed_variables: [aod550bc]
    variable_attributes:
      comment: "wavelength: 550 nm. CAMS climatology aerosol component (radaca.F90), without the MACv2-SP plumes."

  - name: od550dust_mon
    grid_label: __LR_GRID_ATM__
    grid: "OpenIFS TCo95 reduced Gaussian (~100 km)"
