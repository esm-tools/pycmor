tier: veg_atm
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: rls_mon
  compound_name: atmos.rls.tavg-u-hxy-u.mon.glb
  model_variable: str
  expected_units: J m-2
  lr_scale: 0.0002777777777777778
  lr_units: W m-2
  pipelines:
  - lr_monthly
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_str_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
- name: rss_mon
  compound_name: atmos.rss.tavg-u-hxy-u.mon.glb
  model_variable: ssr
  expected_units: J m-2
  lr_scale: 0.0002777777777777778
  lr_units: W m-2
  pipelines:
  - lr_monthly
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_ssr_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
- name: lwp_mon
  compound_name: aerosol.lwp.tavg-u-hxy-u.mon.glb
  model_variable: tclw
  expected_units: kg m-2
  lr_scale: 1
  lr_units: kg m-2
  pipelines:
  - lr_monthly
  grid_label: gr
  grid: OpenIFS TCO95 remapped to 400 x 192 latitude-longitude cells
  lr_input:
    component: oifs
    pattern: atm_remapped_1m_tclw_1m_\d{4}-\d{4}\.nc$
  lr_group: atmos
not_enabled:
- name: hfls_3hr
  compound_name: atmos.hfls.tavg-u-hxy-u.3hr.glb
