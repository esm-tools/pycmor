tier: core_land
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: areacella_lpj
  compound_name: atmos.areacella.ti-u-hxy-u.fx.glb
  model_variable: cell_area
  lr_mesh_variable: cell_area
  lr_units: m2
  grid_label: gn
  grid: 'Practice grid: lpj_grid'
  pipelines:
  - lr_fx
  lr_grid_key: lpj
  lr_group: fx_areacella_lpj
