tier: core_ocean
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: areacello
  compound_name: ocean.areacello.ti-u-hxy-u.fx.glb
  model_variable: cell_area
  lr_mesh_variable: cell_area
  lr_units: m2
  grid_label: gn
  grid: 'Practice grid: core3_grid'
  pipelines:
  - lr_fx
  lr_grid_key: core3
  lr_group: fx_areacello
- name: tos
  compound_name: ocean.tos.tavg-u-hxy-sea.mon.glb
  model_variable: sst
  expected_units: degC
  lr_scale: 1
  lr_units: degC
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
  time_dimname: time
  lr_input:
    component: fesom
    pattern: sst\.fesom\.\d{4}\.nc$
  lr_grid_key: core3
  lr_group: ocean
- name: sos
  compound_name: ocean.sos.tavg-u-hxy-sea.mon.glb
  model_variable: sss
  expected_units: 1e-3
  lr_scale: 1
  lr_units: '0.001'
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
  time_dimname: time
  lr_input:
    component: fesom
    pattern: sss\.fesom\.\d{4}\.nc$
  lr_grid_key: core3
  lr_group: ocean
- name: zos
  compound_name: ocean.zos.tavg-u-hxy-sea.mon.glb
  model_variable: ssh
  expected_units: m
  lr_scale: 1
  lr_units: m
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
