# Reviewed reasons for LR products that have no implemented rule.
#
# The full planner (scripts/full_cmorization.py) reports
# "EXCLUDED_<CATEGORY>: <reason>" instead of "UNMAPPED: no implemented rule"
# for a compound listed here. The product stays in scope and BLOCKED; an entry
# never replaces a READY route, and a global_equivalent entry only applies
# while the global product is READY. UNMAPPED products without an entry are
# counted in report/summary.json and STATUS.txt.
#
# Seeded from the exclude-list check of 16 November 2026
# (~/lr_exclude_check_20261116/verdicts_all.csv): every JUSTIFIED row, and the
# OUTPUT GAP rows whose closing action needs a model source change, which the
# gap-closure design keeps out of scope. No row of final_scope.csv is listed.
# Change an entry only with the evidence that justifies it.
schema_version: 1
categories:
  not_simulated: the model has no such process, tracer or diagnostic, or the DReq condition for the request does not hold
  recom_configuration: REcoM runs without the component (coccolithophores, carbon isotopes)
  global_equivalent: regional subset whose global product is produced, as the DReq note allows
  dropped_by_jan: decided out of scope by Jan
  not_requested: absent from DReq v1.2.2.5 or from the piControl request
  output_gap: the field is not written and writing it needs a model source change
exclusions:
  aerosol.abs550aer.tavg-u-hxy-u.mon.glb: {category: output_gap, reason: "prescribed CAMS clim + MACv2-SP optics are in ecRad per SW band, but no 550nm absorption/extinction-profile/443/865 diagnostic in field_def.xml or yomxios. Needs: IFS code change to export ecRad aerosol optics"}
  aerosol.abs550no3.tavg-u-hxy-u.mon.glb: {category: not_simulated, reason: "no prognostic aerosol: NODE.001_01:3654 '2D CAMS AEROSOL CLIMATOLOGY IS LOADED' (column clim, NAERMACC=1) + MACv2-SP; no 3D/near-surface aerosol mass, number or water in model; CAMS clim species are SS/DU/OM/BC/SU only (radaca.F90 NAERMACC branch), no nitrate/SOA/BB split"}
  aerosol.aoanh.tavg-al-hxy-u.mon.nh: {category: not_simulated, reason: "no idealised/age tracers: only GFL tracers are O3 and CO2_GHG (fort.4 NAMGFL NGHG=1)"}
  aerosol.bry.tavg-p39-hy-air.mon.glb: {category: not_simulated, reason: "no atmospheric chemistry: NODE.001_01:1732 LCHEM_* all F; only GFL tracers are HLO linear O3 and CO2_GHG (fort.4 NAMGFL NGHG=1)"}
