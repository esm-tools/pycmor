schema_version: 1
description: Reviewed FESOM surface iceberg freshwater flux, without inventing a depth distribution or unarchived ice-sheet diagnostics.
scientific_assumptions:
  source_review: FESOM icb_coupling.F90 icb2fesom subtracts ibfwb + ibfwbv + ibfwl + ibfwe from upward-positive water_flux, at the ocean surface only; it skips cavity nodes.
  unit_conversion: The four terms are freshwater volume fluxes in m s-1; multiply their signed sum by freshwater density 1000 kg m-3.
  missing_values: Zero only at verified ice-shelf cavity nodes where the model explicitly excludes iceberg injection; unexplained missing values outside cavities are an error.
  dreq_choice: The 2-D monthly product carries the archived surface sum. The 3-D monthly product is the same sum in the top wet layer (cav_nod_lev) and exact zeros in every deeper wet layer, because FESOM injects iceberg water through the surface water flux only; this is the model's own vertical distribution, not an assumed profile. The 3-hourly 3-D product stays out (dropped by Jan, 2026-10-19).
  layers: Wet layers of a node are [cav_nod_lev, depth_lev) of the CORE3 mesh, checked against the NaN pattern of archived 3-D temp; layers outside are missing, not zero.
  signed_terms: Preserve negative basal-melt terms; never clip freezing to zero.
  applicability: Requires the reviewed FESOM surface-injection convention and a matching native grid with an explicit binary cav_nod_mask; not a generic iceberg reconstruction.
defaults:
  time_dimname: time
  lr_grid_key: core3
  lr_group: icebergs
  lr_iceberg_surface: true
  grid_label: gn
  grid: CORE3 native ocean nodes
  pipelines: [lr_iceberg_surface]
rules:
- name: ficeberg
  compound_name: ocean.ficeberg.tavg-u-hxy-sea.mon.glb
  model_variable: ibfwb
  expected_units: m s-1
  lr_units: kg m-2 s-1
  lr_input: &iceberg_input
    component: fesom
    pattern: ibfwb\.fesom\.\d{4}\.nc$
  lr_terms: &iceberg_terms
  - {component: fesom, variable: ibfwb, pattern: 'ibfwb\.fesom\.\d{4}\.nc$', units: 'm s-1', coefficient: 1000.0}
  - {component: fesom, variable: ibfwbv, pattern: 'ibfwbv\.fesom\.\d{4}\.nc$', units: 'm s-1', coefficient: 1000.0}
  - {component: fesom, variable: ibfwl, pattern: 'ibfwl\.fesom\.\d{4}\.nc$', units: 'm s-1', coefficient: 1000.0}
  - {component: fesom, variable: ibfwe, pattern: 'ibfwe\.fesom\.\d{4}\.nc$', units: 'm s-1', coefficient: 1000.0}
  comment: Signed total iceberg freshwater input to the ocean surface, 1000*(ibfwb+ibfwbv+ibfwl+ibfwe). Positive into ocean; negative freezing terms retained. Verified cavity nodes receive zero because FESOM excludes iceberg injection there. The 3-D ficeberg below carries the same sum in the top wet layer.
- name: ficeberg_layers
  compound_name: ocean.ficeberg.tavg-ol-hxy-sea.mon.glb
  model_variable: ibfwb
  expected_units: m s-1
  lr_units: kg m-2 s-1
  lr_iceberg_layers: true
  lr_exact_ocean_depth: true
  pipelines: [lr_iceberg_layers]
  lr_input: *iceberg_input
  lr_terms: *iceberg_terms
  comment: Signed total iceberg freshwater input, 1000*(ibfwb+ibfwbv+ibfwl+ibfwe), placed in the top wet layer of each column; every deeper wet layer is exactly zero because FESOM injects iceberg water through the surface water flux only (icb_coupling.F90 icb2fesom). The vertical sum equals the 2-D ficeberg. Cavity columns are zero in all wet layers. Positive into ocean; negative freezing terms retained.
