schema_version: 1
description: WAM integrated wave parameters on the WAM sea-point grid (file_def_wam_cmip7.xml.j2).
scientific_assumptions:
  grid: One XIOS cell per WAM sea point (29530 on the LR 1 degree reduced latitude-longitude grid,
    78S to 90N). Land is not part of the grid; WAM writes -999 (decoded as missing) at points it
    masks (sea ice, too shallow), so every mean is over the ice-free samples only.
  grid_label: The WAM grid has no EMD registration yet; the label is taken from the run
    configuration (wam_grid_label) and the products stay blocked without it.
  directions: WAM mwd, mdww and mdts are "from" directions, clockwise from true north
    (sea_surface_*_from_direction), the DReq convention. Checked on 2845 output, wind-sea from 72
    degrees in the January North Pacific trades and from 279 degrees in the Southern Ocean westerlies.
  stokes_drift: ust and vst are eastward and northward on the geographic latitude-longitude WAM grid,
    no rotation. Checked on 2845 output, the drift points opposite to the mean wave direction.
  periods: mpw, mpwswell and mpwwindsea are the inverse-moment periods Tm-1,0 (mwp, mpts, mpww);
    wpp is the peak period pp1d.
  sampling: 3hr products are the instantaneous WAM values at the end of each 3 hour step. swhmax at
    3hr is the maximum of the hourly samples in that step (the DReq asks for time point and a maximum
    at once), stamped at the end of the step like the instants. Monthly products are XIOS means of
    the hourly samples, swhmax the monthly maximum of them, and the directions atan2 of the monthly
    mean sine and cosine.
defaults:
  lr_group: wave
  lr_wave: true
  lr_grid_key: wam
  lr_grid_cells: 29530
  time_dimname: time
  grid: WAM 1 degree reduced latitude-longitude sea points (29530 cells)
  pipelines: [lr_wave]
rules:
- name: swh_3hr
  compound_name: ocean.swh.tpt-u-hxy-sea.3hr.glb
  model_variable: swh
  expected_units: m
  lr_input:
    component: oifs
    pattern: swh\.wam_3h\.\d{4}\.nc$
- name: swhmax_3hr
  compound_name: ocean.swhmax.tpt-u-hxy-sea.3hr.glb
  model_variable: swh_max
  expected_units: m
  lr_wave_window_end: true
  lr_input:
    component: oifs
    pattern: swh_max\.wam_3h\.\d{4}\.nc$
- name: swhswell_3hr
  compound_name: ocean.swhswell.tpt-u-hxy-sea.3hr.glb
  model_variable: shts
  expected_units: m
  lr_input:
    component: oifs
    pattern: shts\.wam_3h\.\d{4}\.nc$
- name: swhwindsea_3hr
  compound_name: ocean.swhwindsea.tpt-u-hxy-sea.3hr.glb
