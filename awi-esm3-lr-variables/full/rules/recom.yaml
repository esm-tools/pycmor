schema_version: 1
description: Reviewed native LR REcoM monthly and daily mappings; no new tracer interpretation is introduced.
scientific_assumptions:
  eligibility_profile: awiesm3-v3.5.1-cc-raw-v1
  applicability: These mappings require the reviewed REcoM tracer definitions and CORE3 geometry. A different
    model build or tracer layout requires a new scientific review.
  configuration_key: carbon_context
  configuration_evidence:
  - Record REcoM and FESOM source revisions and build identity in campaign configuration/state.
  - Verify tracer identities, source units, carbon pools, sign conventions and native vertical geometry
    for the selected run.
  - DFe and NPPn3D/NPPd3D source unit-attribute corrections are specific reviewed assumptions, not general
    unit guesses.
  context_handling: Optional carbon_context is copied to rule comments as operator-supplied provenance.
    Its presence is not automatic scientific validation.
  metadata_policy: All base candidate mappings remain explicit even if absent from pinned DReq metadata;
    the planner must report them BLOCKED rather than omit or reinterpret them.
  currently_unsupported_candidates:
  - ocnBgchem.bsi.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.co2.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.co3.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.phynano.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.poc.tavg-ol-hxy-sea.mon.glb
  unsupported_note: The list above records gaps in the previously audited metadata version, not a permanent
    prohibition; actual support is determined from the selected pinned metadata.
  conversion_constants:
    carbon_mass_g_mol: 12.011
    seconds_per_day: 86400
    mmol_to_mol: 0.001
    umol_to_mol: 1.0e-06
  sum_policy: Only explicitly represented pools are summed; no missing pool, nutrient species or functional
    group is inferred.
  daily_evidence: Native daily source headers were checked for every year 2605-2609, including 366
    records in 2608. Daily fields have time mean cell_methods and noon-centred timestamps; 3D daily
    sources have 47 native layers and surface sources have one nz_sfc layer. Daily recipes apply
    the same reviewed pool definitions and unit conversions as monthly recipes, never temporal upsampling.
surface_variants:
  policy: metadata_supported_only
  source_brand: tavg-ol-
  target_brand: tavg-ols-
  name_suffix: _surface
  method: Select the first native ocean layer; do not interpolate or integrate.
  monthly_pipeline: recom_surface
  linear_pipeline: recom_surface_linear
defaults:
  time_dimname: time
  lr_grid_key: core3
  lr_group: recom
  grid_label: gn
  grid: CORE3 native 220509 nodes; exact model vertical layers
  pipelines:
  - lr_monthly
