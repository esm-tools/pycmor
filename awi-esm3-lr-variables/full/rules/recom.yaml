  comment: 'Net nitrogen production: REcoM recom_sms accumulates uptake minus exudation in
    vertNNAn/vertNNAd; recom_forcing integrates these with model-step layer thickness before writing
    NNAn/NNAd. Requires actual leg enable_coccos=false and equal lossn/lossn_d (the reviewed NNAd
    diagnostic uses lossn). No conversion of bulk DIN to nitrate or ammonium is involved.'
