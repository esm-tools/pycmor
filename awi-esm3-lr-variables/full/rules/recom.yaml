schema_version: 1
description: Reviewed native LR REcoM monthly and daily mappings; nutrient interpretations are stated under
  scientific_assumptions.
scientific_assumptions:
  eligibility_profile: awiesm3-v3.5.1-cc-raw-v1
  applicability: These mappings require the reviewed REcoM tracer definitions and CORE3 geometry. A different
    model build or tracer layout requires a new scientific review.
  configuration_key: carbon_context
  configuration_evidence:
  - Record REcoM and FESOM source revisions and build identity in campaign configuration/state.
  - Verify tracer identities, source units, carbon pools, sign conventions and native vertical geometry
    for the selected run.
  - DFe and NPPn3D/NPPd3D source unit-attribute corrections are specific reviewed assumptions, not general
    unit guesses.
  context_handling: Optional carbon_context is copied to rule comments as operator-supplied provenance.
    Its presence is not automatic scientific validation.
  metadata_policy: All base candidate mappings remain explicit even if absent from pinned DReq metadata;
    the planner must report them BLOCKED rather than omit or reinterpret them.
  currently_unsupported_candidates:
  - ocnBgchem.bsi.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.co2.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.co3.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.phynano.tavg-ol-hxy-sea.mon.glb
  - ocnBgchem.poc.tavg-ol-hxy-sea.mon.glb
  unsupported_note: The list above records gaps in the previously audited metadata version, not a permanent
    prohibition; actual support is determined from the selected pinned metadata.
  blocked_2p3z2d_candidates:
    policy: These piControl ocnBgchem requests (glb area, non-daily frequencies) have deliberately NO rule,
      checked against the actual FESOM/REcoM source at the pinned revision and against this build's own
      config/fesom/namelist.recom (2p3z2d, enable_coccos=.false.). Each is a genuine model-configuration
      gap, not an unmapped-but-available quantity; do not add a rule for one of these without first
      changing the FESOM/REcoM build or its runtime namelist.
    no_coccolithophore_phaeocystis_diazotroph_or_misc_pft:
      reason: enable_coccos=.false. in config/fesom/namelist.recom, so REcoM carries exactly two
        phytoplankton tracers (small/nanophytoplankton Phy -> phynano, diatoms Dia -> phydiat) and no
        diazotroph, coccolithophore, Phaeocystis or generic "other"/"pico" group (no such tracer, NPP term
        or XIOS stream exists anywhere in src/recom or the registered xios_ids list in io_meandata.F90).
        No calc/diaz/misc/pico variant of chl, phy, intpp, limfe, limirr or limn can be derived; REcoM's
        "small" phytoplankton group is already claimed by phynano/limfediat's sibling nano-rules, not
        picophytoplankton.
      candidates:
      - ocnBgchem.chldiaz.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.chlmisc.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.chlpico.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.intppcalc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.intppdiaz.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.intppmisc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.intpppico.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limfecalc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limfediaz.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limfemisc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limfepico.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limirrcalc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limirrdiaz.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limirrmisc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limirrpico.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limncalc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limndiaz.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limnmisc.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.limnpico.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.phycalc.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.phydiaz.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.phymisc.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.phypico.tavg-ol-hxy-sea.mon.glb
    no_irradiance_limitation_diagnostic:
      reason: recom_sms.F90's calculate_photosynthesis_rate computes a per-group light-limitation factor
        (local variable lightlim, commented-out VTCphotLigLim_phyto/_diatoms/_cocco/_phaeo targets) but
        never writes it to a saved module array or an io_meandata.F90 stream; unlike
        limNn/limFen/limNd/limFed (recom_cmip7_diags), no light-limitation field is registered for XIOS
        output for any functional group, including diatoms.
      candidates:
      - ocnBgchem.limirrdiat.tavg-u-hxy-sea.mon.glb
    no_dms_tracer:
      reason: Dimethyl sulphide is not implemented anywhere in this REcoM source (no DMS-related tracer,
        production/consumption term or XIOS stream in src/recom or io_meandata.F90).
      candidates:
      - ocnBgchem.dmso.tavg-ols-hxy-sea.mon.glb
    no_ammonium_tracer:
      reason: DIN is the single combined pool of NO3- and NH4+ with no internal split anywhere in
        recom_sms_init.F90/recom_sms_update.F90 (same basis as the existing no3/po4 rules' comments); nh4
        cannot be isolated from DIN.
      candidates:
      - ocnBgchem.nh4.tavg-ol-hxy-sea.mon.glb
    no_separate_aragonite_pathway:
      reason: REcoM's single CaCO3 pool (Calc tracer, benCalc, calcif/calcdiss, expCalc/bflxCalc, already
        mapped by calc/expcalc*/expcalcob/fric) represents generic calcite production; there is no separate
        aragonite production, dissolution or benthic-flux pathway or tracer. OmegaA/CO3satA (MOCSY) are
        seawater saturation-state diagnostics, already used for co3satarag, not an aragonite mass or flux.
      candidates:
      - ocnBgchem.arag.tavg-ol-hxy-sea.mon.glb
      - ocnBgchem.arag.tavg-ols-hxy-sea.mon.glb
      - ocnBgchem.exparagob.tavg-u-hxy-sea.mon.glb
    no_riverine_nutrient_input:
      reason: useRivers is not enabled for this build/leg (config/bin_2p3z2d/namelist.recom default, not
        overridden in config/fesom/namelist.recom of the reviewed run), so no riverine inorganic/organic
        carbon flux into the ocean surface is computed.
      candidates:
      - ocnBgchem.icfriver.tavg-u-hxy-sea.mon.glb
      - ocnBgchem.ocfriver.tavg-u-hxy-sea.mon.glb
    no_sea_ice_biogeochemistry_module:
      reason: this REcoM source has no sea-ice algae/biogeochemistry component (no recom_ice*-style file,
        no ice-algae tracer, production term or XIOS stream anywhere in src/recom or io_meandata.F90).
      candidates:
      - ocnBgchem.sialgc.tavg-u-hxy-si.mon.glb
      - ocnBgchem.sichl.tavg-u-hxy-si.mon.glb
      - ocnBgchem.sigpp.tavg-u-hxy-si.mon.glb
      - ocnBgchem.sino3.tavg-u-hxy-si.mon.glb
      - ocnBgchem.sisi.tavg-u-hxy-si.mon.glb
  conversion_constants:
    carbon_mass_g_mol: 12.011
    seconds_per_day: 86400
    mmol_to_mol: 0.001
    umol_to_mol: 1.0e-06
  sum_policy: Only explicitly represented pools are summed; no missing pool, nutrient species or functional
    group is inferred.
  nutrient_interpretation: DIN is reported as nitrate (no ammonium tracer) and phosphate is DIN/16, the
    Redfield diagnosis REcoM itself uses for its carbonate chemistry; neither is a separate tracer.
  cmip7_diagnostics: Rules on recom_cmip7_diags streams (field_def_fesom.xml CMIP7 REcoM diagnostics) and
    on the daily 200 m streams (<field>_200, two-layer zoom of nz) report MISSING_INPUT until a leg writes them.
  derived_vertical_policy: Fixed depths are taken from an exact CORE3 level or interpolated linearly in depth
    between the two bracketing levels, never extrapolated; column integrals use the monthly layer thickness
    hnode of the same month.
  daily_evidence: Native daily source headers were checked for every year 2605-2609, including 366
    records in 2608. Daily fields have time mean cell_methods and noon-centred timestamps; 3D daily
    sources have 47 native layers and surface sources have one nz_sfc layer. Daily recipes apply
    the same reviewed pool definitions and unit conversions as monthly recipes, never temporal upsampling.
surface_variants:
  policy: metadata_supported_only
  source_brand: tavg-ol-
  target_brand: tavg-ols-
  name_suffix: _surface
  method: Select the first native ocean layer; do not interpolate or integrate.
  monthly_pipeline: recom_surface
  linear_pipeline: recom_surface_linear
defaults:
  time_dimname: time
  lr_grid_key: core3
  lr_group: recom
  grid_label: gn
  grid: CORE3 native 220509 nodes; exact model vertical layers
  pipelines:
  - lr_monthly
