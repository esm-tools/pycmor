  compound_name: ocnBgchem.fgco2.tavg-u-hxy-sea.mon.glb
  model_variable: CO2f
  expected_units: mmolC/m2/d
  lr_scale: 1.390162037037037e-10
  lr_units: kg m-2 s-1
  lr_input:
    component: fesom
    pattern: CO2f\.fesom\.\d{4}\.nc$
