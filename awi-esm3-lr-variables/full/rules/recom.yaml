  lr_recom_production: iron
  lr_terms:
  - {component: fesom, pattern: 'NNAn\.fesom\.\d{4}\.nc$', variable: NNAn, units: mmolN/m2/d, coefficient: null}
  - {component: fesom, pattern: 'NNAd\.fesom\.\d{4}\.nc$', variable: NNAd, units: mmolN/m2/d, coefficient: null}
  comment: 'Net iron production: recom_sms_update couples biological iron uptake/exudation to the
    same nitrogen terms using Fe2N in micromol Fe per millimol N. Materialization reads fe2n from
    the actual leg namelist and sets coefficient=fe2n*1e-6/86400; never use it as a mol/mol ratio.
    Requires enable_coccos=false and equal lossn/lossn_d. The actual parameter file is an input dependency.'
