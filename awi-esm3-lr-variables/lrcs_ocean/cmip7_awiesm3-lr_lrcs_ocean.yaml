tier: lrcs_ocean
description: LR variable definitions. Shared pipelines/defaults are in ../profile.yaml.
  No experiment years or leg paths belong here.
rules:
- name: wfo
  compound_name: ocean.wfo.tavg-u-hxy-sea.mon.glb
  model_variable: fw
  expected_units: m s-1
  lr_scale: -1025
  lr_units: kg m-2 s-1
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
  time_dimname: time
  lr_input:
    component: fesom
    pattern: fw\.fesom\.\d{4}\.nc$
  lr_grid_key: core3
  lr_group: ocean
- name: tob
  compound_name: ocean.tob.tavg-u-hxy-sea.mon.glb
  model_variable: temp
  expected_units: degC
  lr_scale: 1
  lr_units: degC
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
  time_dimname: time
  lr_bottom: true
  lr_input:
    component: fesom
    pattern: temp\.fesom\.\d{4}\.nc$
  lr_grid_key: core3
  lr_group: ocean
- name: sob
  compound_name: ocean.sob.tavg-u-hxy-sea.mon.glb
  model_variable: salt
  expected_units: 1e-3
  lr_scale: 1
  lr_units: '0.001'
  pipelines:
  - lr_monthly
  grid_label: gn
  grid: FESOM CORE3 native 220509 nodes; 47 ocean layers
  time_dimname: time
  lr_bottom: true
  lr_input:
    component: fesom
    pattern: salt\.fesom\.\d{4}\.nc$
  lr_grid_key: core3
  lr_group: ocean
