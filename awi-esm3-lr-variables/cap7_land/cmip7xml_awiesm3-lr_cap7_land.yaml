  # --- Carbon pools (10) ---

  - name: cLand_mon
    inputs:
      - path: *ldp
        pattern: "**/cLand_monthly.out"
    compound_name: land.cLand.tavg-u-hxy-lnd.mon.glb
    model_variable: Total
    source_units: "kg m-2"
    pipelines:
      - lpjg_monthly_pipeline

