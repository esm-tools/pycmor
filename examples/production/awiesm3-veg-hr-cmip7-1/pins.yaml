# Everything outside the Python env that the awiesm3-veg-hr-cmip7-1 production
# reads. campaign.py setup installs or checks each item and verify checks it
# again before every year, so a change elsewhere (LR work, a git pull, a CV
# refresh) cannot reach a running HR campaign.

# CMIP7 CMOR tables, read by the aicc checker (CMIP7_TABLES_PATH).
cmip7_tables:
  repo: https://github.com/WCRP-CMIP/cmip7-cmor-tables.git
  commit: ae3a8037b7077864f8155db882216f217eda5407

# Controlled vocabularies, installed into the campaign's own ESGVOC_HOME and
# never refreshed during the campaign. The versions cli124 ran with.
esgvoc:
  universe: v3.2.7
  cmip7: v2.4.1

# Data Request metadata (CMIP7_DReq_metadata in the tier yamls), exported with
# export_dreq_lists_json at setup. The export is deterministic.
dreq:
  version: v1.2.2.5
  metadata_sha256: eccf9f9296488581939310a37c60849501f77c9c9dd27faf8585b2345c18b9e3

# Static inputs named in the tier yamls (mesh, basin mask, tripyview mesh
