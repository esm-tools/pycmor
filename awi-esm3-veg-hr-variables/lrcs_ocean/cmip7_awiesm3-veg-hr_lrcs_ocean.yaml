  # pattern: osaltdiff\.fesom\.\d{4}\.nc
  # compound_name: ocean.osaltdiff.tavg-ol-hxy-sea.yr.glb
  # model_variable: osaltdiff
  # model_unit: "kg m-2 s-1"
  # lazy_write: true
  #
  # rsdoabsorb — net rate of absorption of shortwave energy in ocean layer (3D)
  - name: rsdoabsorb
    inputs:
      - path: *dp
        pattern: rsdoabsorb\.fesom\.\d{4}\.nc
    compound_name: ocean.rsdoabsorb.tavg-ol-hxy-sea.yr.glb
    model_variable: rsdoabsorb
    lazy_write: true

  # ============================================================
  # Overturning streamfunctions (msftm, msftmmpa)
  # ============================================================

  # msftm — meridional overturning in density space (resolved + parameterized).
  # Inputs are the std_dens_*.fesom.YYYY.nc family written by FESOM when
  # ldiag_dMOC=.true.; the custom step opens them itself, so the rule's
  # input pattern just needs to match one of the files for rule discovery.
  - name: msftm_density
    inputs:
      - path: *dp
        pattern: std_dens_DIV\.fesom\.\d{4}\.nc
    compound_name: ocean.msftm.tavg-rho-hyb-sea.mon.glb
    # Zonal mean, not on the FESOM mesh: integrated over longitude and over
    # basins, 180 latitude bands of 1 degree centred on the half degree.
    # g239 was registered for exactly this on 2026-08-18 (EMD #1293), so
    # stop inheriting the tier's g130, which claimed the 3146761 nodes.
    grid_label: g239
    model_variable: msftm
    pipelines:
      - msftm_density_pipeline

  # msftmmpa — MOC due to parameterized mesoscale advection, depth-space.
  # Uses bolus_w (vertical bolus velocity at nodes) — reuses the calc_zmoc
  # flow with bolus_w in place of w. Requires fer_gm=.true.
  # DEACTIVATED: AWI-CM3 HR does not run with fer_gm enabled; bolus_w is
  # never produced. Re-enable when/if a GM-on HR config exists.
  # - name: msftmmpa_depth
  #   inputs:
  #     - path: *dp
  #       pattern: bolus_w\.fesom\.\d{4}\.nc
  #   compound_name: ocean.msftmmpa.tavg-ol-hyb-sea.mon.glb
  #   model_variable: msftmmpa
  #   pipelines:
  #     - msftmmpa_depth_pipeline

  # msftmmpa — MOC due to parameterized mesoscale advection, density-space.
  # Uses std_dens_DIVbolus from FESOM's online density-class binning.
  # DEACTIVATED: same reason as msftmmpa_depth — fer_gm off in HR config.
  # - name: msftmmpa_density
  #   inputs:
  #     - path: *dp
  #       pattern: std_dens_DIVbolus\.fesom\.\d{4}\.nc
  #   compound_name: ocean.msftmmpa.tavg-rho-hyb-sea.mon.glb
  #   model_variable: msftmmpa
  #   pipelines:
  #     - msftmmpa_density_pipeline

  # ============================================================
  # HARD: 3D salt transport (sfx, sfy)
  # ============================================================

  # sfx/sfy — 3D and depth-integrated salt mass transport
  # sfx = u × S × rho_0 × dz; sfy = v × S × rho_0 × dz
  # Primary input: unod/vnod. Salinity loaded as secondary field via
  # salt_path / salt_pattern / salt_variable rule attributes.

  - name: sfx
    inputs:
      - path: *dp
        pattern: unod\.fesom\.\d{4}\.nc
    compound_name: ocean.sfx.tavg-ol-hxy-sea.mon.glb
    model_variable: unod
    salt_path: *dp
    salt_pattern: salt\.fesom\.\d{4}\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: x
    lazy_write: true
    pipelines:
      - salt_transport_pipeline

  - name: sfx_int
    inputs:
      - path: *dp
        pattern: unod\.fesom\.\d{4}\.nc
    compound_name: ocean.sfx.tavg-u-hxy-sea.mon.glb
    model_variable: unod
    salt_path: *dp
    salt_pattern: salt\.fesom\.\d{4}\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: x
    lazy_write: true
    pipelines:
      - salt_transport_integrated_pipeline

  - name: sfy
    inputs:
      - path: *dp
        pattern: vnod\.fesom\.\d{4}\.nc
    compound_name: ocean.sfy.tavg-ol-hxy-sea.mon.glb
    model_variable: vnod
    salt_path: *dp
    salt_pattern: salt\.fesom\.\d{4}\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: y
    lazy_write: true
    pipelines:
      - salt_transport_pipeline

  - name: sfy_int
    inputs:
      - path: *dp
        pattern: vnod\.fesom\.\d{4}\.nc
    compound_name: ocean.sfy.tavg-u-hxy-sea.mon.glb
    model_variable: vnod
    salt_path: *dp
    salt_pattern: salt\.fesom\.\d{4}\.nc
    salt_variable: salt
    reference_density: 1025.0
    transport_component: y
    lazy_write: true
    pipelines:
      - salt_transport_integrated_pipeline

  # ============================================================
  # Basin-integrated overturning / heat / salt transports
  # (depth-space MOC, basin northward heat and salt transport).
  # Pipelines use compute_msftmz / compute_hfbasin / compute_sltbasin
  # in examples/custom_steps.py.
  # ============================================================

  - name: msftmz
    inputs:
      - path: *dp
        pattern: w\.fesom\.\d{4}\.nc
    compound_name: ocean.msftm.tavg-ol-hyb-sea.mon.glb
    # Zonal mean, not on the FESOM mesh: integrated over longitude and over
    # basins, 180 latitude bands of 1 degree centred on the half degree.
    # g239 was registered for exactly this on 2026-08-18 (EMD #1293), so
    # stop inheriting the tier's g130, which claimed the 3146761 nodes.
    grid_label: g239
    model_variable: msftmz
    pipelines:
      - msftmz_pipeline

  - name: hfbasin
    inputs:
      - path: *dp
        pattern: vtemp\.fesom\.\d{4}\.nc
    compound_name: ocean.hfbasin.tavg-u-hyb-sea.mon.glb
    # Zonal mean, not on the FESOM mesh: integrated over longitude and over
    # basins, 180 latitude bands of 1 degree centred on the half degree.
    # g239 was registered for exactly this on 2026-08-18 (EMD #1293), so
    # stop inheriting the tier's g130, which claimed the 3146761 nodes.
    grid_label: g239
    model_variable: hfbasin
    # compute_hfbasin_tripyview loads utemp as a secondary input alongside
    # the primary vtemp; both are needed for the edge-crossing integral.
    utemp_path: *dp
    utemp_pattern: utemp\.fesom\.\d{4}\.nc
    utemp_variable: utemp
    pipelines:
      - hfbasin_pipeline

  - name: sltbasin
    inputs:
      - path: *dp
        pattern: vsalt\.fesom\.\d{4}\.nc
    compound_name: ocean.sltbasin.tavg-u-hyb-sea.mon.glb
    # Zonal mean, not on the FESOM mesh: integrated over longitude and over
    # basins, 180 latitude bands of 1 degree centred on the half degree.
    # g239 was registered for exactly this on 2026-08-18 (EMD #1293), so
    # stop inheriting the tier's g130, which claimed the 3146761 nodes.
    grid_label: g239
    model_variable: sltbasin
    # compute_sltbasin_tripyview loads usalt as a secondary input alongside
    # the primary vsalt; both are needed for the edge-crossing integral.
    usalt_path: *dp
    usalt_pattern: usalt\.fesom\.\d{4}\.nc
    usalt_variable: usalt
    pipelines:
      - sltbasin_pipeline
